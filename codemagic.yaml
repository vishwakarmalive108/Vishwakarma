workflows:
  vishwakarmaa-pilot-v2:
    name: Vishwakarmaa Factory Attendance Pilot V2
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Extract fixed Android source
        script: |
          set -e
          rm -rf build-source
          mkdir -p build-source
          unzip -q vishwakarmaa-v2-source.zip -d build-source
          test -f build-source/android/settings.gradle
          test -f build-source/android/app/build.gradle
      - name: Configure Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/build-source/android/local.properties"
      - name: Prepare Gradle wrapper
        script: |
          cd "$CM_BUILD_DIR/build-source/android"
          gradle wrapper --gradle-version 8.7 --distribution-type bin
      - name: Build debug APK
        script: |
          cd "$CM_BUILD_DIR/build-source/android"
          chmod +x ./gradlew
          ./gradlew clean assembleDebug
      - name: Verify APK
        script: |
          test -f "$CM_BUILD_DIR/build-source/android/app/build/outputs/apk/debug/app-debug.apk"
          echo "SUCCESS: Vishwakarmaa Pilot V2 APK created."
    artifacts:
      - build-source/android/app/build/outputs/apk/debug/*.apk
