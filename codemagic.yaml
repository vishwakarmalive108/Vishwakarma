workflows:
  android-debug:
    name: Mannat Workforce OS Test APK
    max_build_duration: 30
    instance_type: linux_x2
    scripts:
      - name: Extract Mannat source
        script: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q mannat-v61-source.zip -d buildsrc || unzip -q mannat-v61-source.zip -d buildsrc
          PROJECT_DIR=$(find buildsrc -type d -name android -print -quit)
          if [ -z "$PROJECT_DIR" ]; then echo "Android project not found"; exit 1; fi
          cd "$PROJECT_DIR"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew || true
          ./gradlew assembleDebug
      - name: Copy APK
        script: |
          PROJECT_DIR=$(find buildsrc -type d -name android -print -quit)
          mkdir -p "$CM_BUILD_DIR/output"
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$CM_BUILD_DIR/output/Mannat_Workforce_OS_Test.apk"
    artifacts:
      - output/Mannat_Workforce_OS_Test.apk
