workflows:
  android-debug:
    name: Mannat Workforce OS V62
    max_build_duration: 30
    instance_type: linux_x2

    environment:
      android_signing:
        - keystore_reference

    scripts:
      - name: Extract V62 source
        script: |
          unzip -o mannat-v62-source.zip -d v62
          
      - name: Build Android debug APK
        script: |
          cd v62/android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - v62/android/app/build/outputs/apk/debug/*.apk
