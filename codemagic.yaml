workflows:
  android-debug:
    name: Mannat Workforce OS V62
    max_build_duration: 60
    instance_type: mac_mini_m2

    scripts:

      - name: Extract V62 source
        script: |
          set -e

          echo "Extracting V62 source..."

          rm -rf v62
          mkdir -p v62

          unzip -o mannat-v62-source.zip -d v62

          echo "Source extraction completed."

      - name: Find Android project
        script: |
          set -e

          echo "Searching for Android project..."

          find v62 -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
          \) -print

      - name: Fix BiometricPrompt Activity compatibility
        script: |
          set -e

          echo "Searching for MainActivity.java..."

          MAIN_ACTIVITY=$(find v62 -type f -name "MainActivity.java" -print -quit)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found."
            find v62 -type f -name "*.java" -print
            exit 1
          fi

          echo "MainActivity found at:"
          echo "$MAIN_ACTIVITY"

          echo "Current MainActivity declaration:"
          grep -n "class MainActivity" "$MAIN_ACTIVITY" || true

          echo "Applying BiometricPrompt compatibility fix..."

          perl -pi -e 's/public class MainActivity extends Activity/public class MainActivity extends androidx.fragment.app.FragmentActivity/' "$MAIN_ACTIVITY"

          perl -pi -e 's/public class MainActivity extends ComponentActivity/public class MainActivity extends androidx.fragment.app.FragmentActivity/' "$MAIN_ACTIVITY"

          echo "Updated MainActivity declaration:"
          grep -n "class MainActivity" "$MAIN_ACTIVITY" || true

          echo "BiometricPrompt compatibility fix completed."

      - name: Generate Gradle wrapper and build APK
        script: |
          set -e

          echo "Locating Android Gradle project..."

          GRADLE_FILE=$(find v62 -type f -name "settings.gradle" -print -quit)

          if [ -z "$GRADLE_FILE" ]; then
            GRADLE_FILE=$(find v62 -type f -name "settings.gradle.kts" -print -quit)
          fi

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Android Gradle project not found."

            echo "Files found inside V62:"
            find v62 -maxdepth 6 -type f | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo "Checking installed Gradle..."
          gradle --version

          echo "Generating Gradle wrapper..."
          gradle wrapper

          echo "Checking generated Gradle wrapper..."

          ls -la
          ls -la gradle/wrapper

          chmod +x gradlew

          echo "Building Android debug APK..."

          ./gradlew assembleDebug

          echo "Android debug build completed."

      - name: Collect APK
        script: |
          set -e

          echo "Searching for generated APK..."

          APK=$(find v62 -type f -path "*/build/outputs/apk/*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not generated."

            find v62 -type f -name "*.apk" -print

            exit 1
          fi

          echo "APK found at:"
          echo "$APK"

          mkdir -p artifacts

          cp "$APK" artifacts/mannat-workforce-v62-debug.apk

          echo "APK copied successfully."

    artifacts:
      - artifacts/mannat-workforce-v62-debug.apk
